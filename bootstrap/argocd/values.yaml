# Used twice: by `make bootstrap` for the first install, and by the argocd
# Application afterwards, when ArgoCD takes over managing itself. Both put
# components.argocd from clusters/<env>/platform.yaml on top, so the handover
# does not change anything.
global:
  domain: argocd.localhost

configs:
  params:
    # TLS ends at the Gateway, not in the ArgoCD server.
    server.insecure: true
  cm:
    # Resources are tracked by annotation, so copies made by operators (the
    # Secrets CloudNativePG writes, for example) are not mistaken for ours.
    application.resourceTrackingMethod: annotation
    timeout.reconciliation: 60s
    # ArgoCD stopped assessing the health of child Applications by default.
    # Without this, sync waves in the root app would not wait for anything.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  repositories:
    envoyproxy:
      type: helm
      name: envoyproxy
      url: docker.io/envoyproxy
      enableOCI: "true"

dex:
  enabled: false

notifications:
  enabled: false
