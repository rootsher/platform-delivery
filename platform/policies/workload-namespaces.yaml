# Pod security itself is enforced by the built in Pod Security Admission at the
# restricted level. This keeps anyone from quietly relaxing it: a namespace
# that is not a platform or system namespace must carry the restricted label.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-namespaces
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    objectSelector:
      matchExpressions:
        - key: platform.rootsher.dev/tier
          operator: NotIn
          values: [platform]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  validations:
    - expression: >-
        object.metadata.?labels[?'pod-security.kubernetes.io/enforce'].orValue('') == 'restricted'
      message: namespaces must enforce the restricted pod security level
