# Requests are what the scheduler plans with and a memory limit is what keeps
# one pod from taking a node down. CPU limits are left out on purpose: they
# throttle a pod even when the node has idle CPU.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-resources
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    # Everything except the platform's own namespaces (labelled by ArgoCD
    # only, see platform-namespaces) and the ones Kubernetes itself owns. A
    # namespace nobody labelled is in scope, not out of it.
    namespaceSelector:
      matchExpressions:
        - key: platform.rootsher.dev/tier
          operator: NotIn
          values: [platform]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          has(c.resources) &&
          c.resources.?requests.?cpu.hasValue() &&
          c.resources.?requests.?memory.hasValue() &&
          c.resources.?limits.?memory.hasValue())
      messageExpression: >-
        'every container needs cpu and memory requests and a memory limit, missing on: '
        + variables.containers.filter(c, !(
            has(c.resources) &&
            c.resources.?requests.?cpu.hasValue() &&
            c.resources.?requests.?memory.hasValue() &&
            c.resources.?limits.?memory.hasValue())).map(c, c.name).join(', ')
