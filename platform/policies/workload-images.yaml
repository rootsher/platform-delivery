# What a workload may run: images from known registries, pinned by digest.
# A tag can be moved to different content after the signature was checked,
# a digest cannot.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-images
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    # Everything except the platform's own namespaces (labelled by ArgoCD
    # only, see platform-namespaces) and the ones Kubernetes itself owns. A
    # namespace nobody labelled is in scope, not out of it.
    namespaceSelector:
      matchExpressions:
        - key: platform.rootsher.dev/tier
          operator: NotIn
          values: [platform]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # kubectl debug adds containers through this subresource.
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
    - name: registries
      expression: "['ghcr.io/rootsher/', 'ghcr.io/cloudnative-pg/']"
  validations:
    - expression: >-
        variables.containers.all(c, variables.registries.exists(r, c.image.startsWith(r)))
      messageExpression: >-
        'images must come from ' + variables.registries.join(', ') + ', got: '
        + variables.containers.filter(c, !variables.registries.exists(r, c.image.startsWith(r))).map(c, c.image).join(', ')
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:'))
      messageExpression: >-
        'images must be pinned by digest, got: '
        + variables.containers.filter(c, !c.image.contains('@sha256:')).map(c, c.image).join(', ')
