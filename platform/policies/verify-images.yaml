# An image from this account runs only if CI built it: signed keyless by the
# main branch workflow of the service repo, with the SBOM attached as a signed
# attestation. A locally built image with the same name is rejected.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-images
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    # Everything except the platform's own namespaces (labelled by ArgoCD
    # only, see platform-namespaces) and the ones Kubernetes itself owns. A
    # namespace nobody labelled is in scope, not out of it.
    namespaceSelector:
      matchExpressions:
        - key: platform.rootsher.dev/tier
          operator: NotIn
          values: [platform]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        # kubectl debug adds containers through this subresource.
        resources: [pods, pods/ephemeralcontainers]
  matchImageReferences:
    - glob: ghcr.io/rootsher/*
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/rootsher/[^/]+/\.github/workflows/ci\.yml@refs/heads/main$
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom
  validations:
    - expression: >-
        (images.containers + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([]))
          .map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
      message: images must be signed by the main branch CI workflow
    - expression: >-
        (images.containers + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([]))
          .map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.ci])).all(e, e > 0)
      message: images must carry a signed CycloneDX SBOM attestation
