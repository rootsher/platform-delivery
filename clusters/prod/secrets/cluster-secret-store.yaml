# Same name as the local store, so ExternalSecrets do not change between
# environments. There are no credentials here: the external-secrets service
# account gets an IAM role through EKS Pod Identity, and the SDK picks it up.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
