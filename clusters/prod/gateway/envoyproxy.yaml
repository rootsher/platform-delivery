# A network load balancer in front of the proxies, targeting the Envoy pods
# directly by IP. It only passes TCP through; TLS is terminated by Envoy, so
# the certificate is managed in one place.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy
  namespace: gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          # IP targets do not see the client address unless asked to, and
          # externalTrafficPolicy does not apply to them.
          service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
      envoyDeployment:
        replicas: 3
        container:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
      envoyPDB:
        minAvailable: 1
