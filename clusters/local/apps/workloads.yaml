# One Application per directory in environments/local. The directory name is
# both the chart and the namespace, and the values in it are the only thing
# that differs from another environment.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/rootsher/platform-delivery.git
        revision: main
        directories:
          - path: environments/local/*
  template:
    metadata:
      name: 'local-{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/rootsher/platform-delivery.git
        targetRevision: main
        path: 'charts/{{ .path.basename }}'
        helm:
          releaseName: '{{ .path.basename }}'
          valueFiles:
            - '../../{{ .path.path }}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            platform.rootsher.dev/tier: workload
        # The first sync can land before the operator's CRDs are ready.
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
