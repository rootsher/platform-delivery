# Sets up OpenBao the way external-secrets expects it: Kubernetes auth and
# a read only role for the external-secrets service account. Nothing else uses
# the dev root token; after this, access goes through service account tokens
# exactly as it would against a real store.
#
# Dev mode forgets everything on restart. If the OpenBao pod restarts, sync the
# secrets Application again to rerun this.
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-openbao
  namespace: openbao
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.6.0@sha256:900bb64d0671cd1d82b693c56206f7263b582445f3a3bb6ba6e5213f524a6653
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
            - name: BAO_TOKEN
              value: root
            - name: HOME
              value: /tmp
          command: [sh, -euc]
          args:
            - |
              bao auth list | grep -q '^kubernetes/' || bao auth enable kubernetes
              bao write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc
              bao policy write external-secrets - <<'POLICY'
              path "secret/data/*" { capabilities = ["read"] }
              path "secret/metadata/*" { capabilities = ["read", "list"] }
              POLICY
              bao write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=external-secrets \
                policies=external-secrets ttl=1h
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
