# kind has no load balancer, so the proxy is exposed on a fixed NodePort that
# clusters/local/kind.yaml maps to port 8080 on the host. Only the control
# plane node has that mapping and the proxy runs on a worker, so traffic has to
# be allowed to hop between nodes; Envoy Gateway defaults to Local.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy
  namespace: gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: 30080
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
