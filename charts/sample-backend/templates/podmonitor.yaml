{{- /*
Scrapes pods rather than a Service: the stable and canary Services overlap
between releases and would count every pod twice. The pod template hash comes
along as a label, which is how the canary analysis tells the new release from
the old one. job is the release name, as it was for the ServiceMonitor and as
the SLO rules expect.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "sample-backend.name" . }}
  labels:
    {{- include "sample-backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sample-backend.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  jobLabel: app.kubernetes.io/instance
  podTargetLabels:
    - rollouts-pod-template-hash
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
