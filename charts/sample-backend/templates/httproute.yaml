{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sample-backend.name" . }}
  labels:
    {{- include "sample-backend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "route.gateway.name is required" .Values.route.gateway.name }}
      {{- with .Values.route.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.route.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      # The weights are the rollout controller's to move; ArgoCD ignores
      # them (see the workloads ApplicationSet), and git keeps the resting
      # state: everything on stable.
      backendRefs:
        - name: {{ include "sample-backend.name" . }}-stable
          port: 80
          weight: 100
        - name: {{ include "sample-backend.name" . }}-canary
          port: 80
          weight: 0
{{- end }}
