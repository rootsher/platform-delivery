{{- /*
A Deployment that releases in steps. A new pod template, which is what a new
digest is, first gets a tenth of the traffic and then half, while the
analysis below compares the canary's 5xx rate with the error budget. If it
fails, the controller sends everything back to the stable pods and scales
the canary down; the revert in git stays a human decision (ADR 14).
*/ -}}
{{- $name := include "sample-backend.name" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $name }}
  labels:
    {{- include "sample-backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  # A canary that never gets ready is a failed release too.
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  strategy:
    canary:
      stableService: {{ $name }}-stable
      canaryService: {{ $name }}-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ $name }}
            namespace: {{ .Release.Namespace }}
      analysis:
        templates:
          - templateName: {{ $name }}-error-rate
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        {{- range .Values.canary.weights }}
        - setWeight: {{ . }}
        - pause:
            duration: {{ $.Values.canary.pause }}
        {{- end }}
  selector:
    matchLabels:
      {{- include "sample-backend.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "sample-backend.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "sample-backend.name" . }}
      terminationGracePeriodSeconds: {{ add .Values.drainDelaySeconds 25 }}
      securityContext:
        {{- include "sample-backend.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "sample-backend.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: {{ include "sample-backend.image" . }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.faultErrorRate }}
            - name: FAULT_ERROR_RATE
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Chart.Name }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name={{ required "environment is required" .Values.environment }},service.version={{ .Values.image.digest | trunc 19 }}
            {{- include "sample-backend.databaseEnv" . | nindent 12 }}
          # /healthz never touches the database, so a Postgres failover does
          # not restart every pod. /readyz does, and takes the pod out of the
          # endpoints instead.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.drainDelaySeconds }}
          securityContext:
            {{- include "sample-backend.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
