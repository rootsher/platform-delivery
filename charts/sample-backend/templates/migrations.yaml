{{- /*
Runs from the same digest as the Rollout, so the schema and the code that
needs it can never come from different builds. It is a Sync hook in wave 0:
after the database (wave -1), before the new pods (wave 1). Migrations are
expand then contract, so the pods of the previous release keep working while
this runs.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sample-backend.name" . }}-migrate
  labels:
    {{- include "sample-backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "sample-backend.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "sample-backend.name" . }}
      securityContext:
        {{- include "sample-backend.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "sample-backend.image" . }}
          args:
            - node_modules/node-pg-migrate/bin/node-pg-migrate.js
            - up
            - --migrations-dir=migrations
            - --no-verbose
          env:
            {{- include "sample-backend.databaseEnv" . | nindent 12 }}
          securityContext:
            {{- include "sample-backend.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
