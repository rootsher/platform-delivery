apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-backend.name" . }}
  labels:
    {{- include "sample-backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "sample-backend.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "sample-backend.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "sample-backend.name" . }}
      terminationGracePeriodSeconds: {{ add .Values.drainDelaySeconds 25 }}
      securityContext:
        {{- include "sample-backend.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "sample-backend.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: {{ include "sample-backend.image" . }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- include "sample-backend.databaseEnv" . | nindent 12 }}
          # /healthz never touches the database, so a Postgres failover does
          # not restart every pod. /readyz does, and takes the pod out of the
          # endpoints instead.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.drainDelaySeconds }}
          securityContext:
            {{- include "sample-backend.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
