image:
  repository: ghcr.io/rootsher/platform-sample-backend
  # Always a digest. Promotion between environments is a change of this value
  # and nothing else, so a tag that can move under us has no place here.
  digest: ""

replicas: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

logLevel: info

# Set by the workloads ApplicationSet from the cluster name.
environment: ""

telemetry:
  # Traces go to the node's OpenTelemetry collector. Metrics are scraped by
  # Prometheus from /metrics, so the SDK does not export them a second time.
  otlpEndpoint: http://otel-collector.monitoring.svc:4318

slo:
  # Share of non 5xx responses over 30 days, and share of requests answered
  # within latencyThreshold seconds (must be one of the histogram buckets).
  availability: 0.995
  latency: 0.95
  latencyThreshold: "0.25"

# Seconds the pod keeps serving after it is marked for deletion, so that
# endpoints and load balancers stop sending traffic before SIGTERM arrives.
drainDelaySeconds: 5

database:
  image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:172f3273cdd8d0214c5afaccdc4c1cfa3d4e2d67bc335d999c4fd1258ce54ebb
  instances: 2
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

migrations:
  backoffLimit: 6

route:
  enabled: false
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
  hostnames: []
