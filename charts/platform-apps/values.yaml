# Name of the cluster, which is also the environment: selects
# clusters/<cluster>/ and environments/<cluster>/.
cluster: ""

repoURL: https://github.com/rootsher/platform-delivery.git
revision: main

# Extra Helm values per component, merged over the defaults in the templates.
# Sizes belong here; anything that is not a size needs a reason in an ADR.
components:
  argocd: {}
  argoRollouts: {}
  # Cloud clusters only. clusterName, region and vpcId come from the
  # terraform outputs of infra/aws/stack.
  awsLoadBalancerController:
    enabled: false
  cloudnativePg: {}
  envoyGateway: {}
  externalSecrets: {}
  kubePrometheusStack: {}
  kyverno: {}
  loki: {}
  opentelemetryCollector: {}
  tempo: {}
  openbao:
    # Only the local cluster runs its own secret store.
    enabled: false
  storage:
    # Cloud clusters only; kind brings its own default class.
    enabled: false
