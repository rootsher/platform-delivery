{{- if .Values.components.storage.enabled }}
# Storage classes of the cluster. EKS no longer marks any class as default, so
# without this every PersistentVolumeClaim (Prometheus, Loki, Tempo, Postgres)
# would stay Pending.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.revision }}
    path: clusters/{{ $.Values.cluster }}/storage
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
