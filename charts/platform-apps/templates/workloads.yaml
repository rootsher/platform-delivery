{{- /*
One Application per directory in environments/<cluster>. The directory name is
both the chart and the namespace, and the values in it are the only thing that
differs from another environment. The inner {{ }} belong to the ApplicationSet,
so they are escaped from Helm.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $.Values.repoURL }}
        revision: {{ $.Values.revision }}
        directories:
          - path: environments/{{ $.Values.cluster }}/*
  template:
    metadata:
      name: '{{ $.Values.cluster }}-{{ "{{ .path.basename }}" }}'
    spec:
      project: default
      source:
        repoURL: {{ $.Values.repoURL }}
        targetRevision: {{ $.Values.revision }}
        path: 'charts/{{ "{{ .path.basename }}" }}'
        helm:
          releaseName: '{{ "{{ .path.basename }}" }}'
          valueFiles:
            - '../../{{ "{{ .path.path }}" }}/values.yaml'
          valuesObject:
            environment: {{ $.Values.cluster }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ "{{ .path.basename }}" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            platform.rootsher.dev/tier: workload
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
        # The first sync can land before the operator's CRDs are ready.
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
