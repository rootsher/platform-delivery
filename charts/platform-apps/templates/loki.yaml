{{- $defaults := dict
  "deploymentMode" "SingleBinary"
  "loki" (dict
    "auth_enabled" false
    "commonConfig" (dict "replication_factor" 1)
    "storage" (dict "type" "filesystem")
    "schemaConfig" (dict "configs" (list (dict
      "from" "2026-08-01" "store" "tsdb" "object_store" "filesystem" "schema" "v13"
      "index" (dict "prefix" "index_" "period" "24h"))))
    "limits_config" (dict "allow_structured_metadata" true "retention_period" "168h"))
  "singleBinary" (dict "replicas" 1 "persistence" (dict "size" "5Gi"))
  "backend" (dict "replicas" 0)
  "read" (dict "replicas" 0)
  "write" (dict "replicas" 0)
  "gateway" (dict "enabled" false)
  "chunksCache" (dict "enabled" false)
  "resultsCache" (dict "enabled" false)
  "lokiCanary" (dict "enabled" false)
  "test" (dict "enabled" false)
-}}
# Logs, received over OTLP from the collector. Single binary on the local
# filesystem by default; the cloud clusters switch the object store to S3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      releaseName: loki
      valuesObject:
        {{- mergeOverwrite $defaults .Values.components.loki | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
