apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    # Operators before workloads, so their CRDs exist when the workloads sync.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.28.2
    helm:
      releaseName: cnpg
      {{- /*
      The operator also runs as an init container in every database pod, so it
      is pinned by digest like any other workload image.
      */}}
      {{- $defaults := dict "image" (dict "tag" "1.29.1@sha256:0dfff19ba7b52ca25851a1010028b6940fff2e233290465af1cfb08a5f3f4661") }}
      valuesObject:
        {{- mergeOverwrite $defaults .Values.components.cloudnativePg | toYaml | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for the last-applied annotation.
      - ServerSideApply=true
