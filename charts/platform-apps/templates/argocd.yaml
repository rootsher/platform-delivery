apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.3.2
      helm:
        releaseName: argocd
        valueFiles:
          - $repo/bootstrap/argocd/values.yaml
        {{- with .Values.components.argocd }}
        valuesObject:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.revision }}
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    # Lets the ArgoCD UI attach its route to the platform Gateway.
    managedNamespaceMetadata:
      labels:
        platform.rootsher.dev/tier: platform
